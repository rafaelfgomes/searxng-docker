services:
  cache:
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    container_name: searxng-valkey
    volumes:
      - ${SEARXNG_VALKEY_DATA_FOLDER:-./searxng-valkey_data}:/data
    restart: unless-stopped
    user: ${UID:-1000}:${GID:-1000}
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      local:
        ipv4_address: 172.${SUBNET_NUMBER:-20}.0.3

  searxng:
    image: searxng/searxng
    container_name: searxng-app
    volumes:
      - ./configs:/etc/searxng
      - ${SEARXNG_CACHE_FOLDER:-./data}:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-false}
      - SEARXNG_VALKEY_URL=valkey://cache:6379/0
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_LIMITER=${SEARXNG_LIMITER:-false}
      - SEARXNG_IMAGE_PROXY=${SEARXNG_IMAGE_PROXY:-false}
    user: ${UID:-1000}:${GID:-1000}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    depends_on:
      - cache
    networks:
      local:
        ipv4_address: 172.${SUBNET_NUMBER:-20}.0.2
      external:
        ipv4_address: ${SEARXNG_IP}

networks:
  local:
    name: searxng-local-network
    ipam:
      config:
        - subnet: 172.${SUBNET_NUMBER:-20}.0.0/16
  external:
    external: true
    name: ${EXTERNAL_NETWORK_NAME}